name: build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
            rust-targets: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run lint

      - run: cargo test -q
        working-directory: src-tauri

      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain_password=$(openssl rand -base64 24)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$keychain_password" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" build.keychain
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            npm run tauri build -- ${{ matrix.args }} --config "{\"bundle\":{\"macOS\":{\"signingIdentity\":\"$APPLE_SIGNING_IDENTITY\"}}}"
          else
            npm run tauri build -- ${{ matrix.args }}
          fi

      - name: Smoke test bundled ClamAV (macOS)
        if: runner.os == 'macOS'
        run: |
          app=$(find src-tauri/target -path "*/bundle/macos/*.app" -maxdepth 5 | head -1)
          clam="$app/Contents/Resources/clamav"
          work="$RUNNER_TEMP/clamav-smoke"
          mkdir -p "$work/db"
          printf 'DatabaseDirectory %s\nDatabaseMirror database.clamav.net\n' "$work/db" > "$work/freshclam.conf"
          "$clam/freshclam" --config-file="$work/freshclam.conf" --version
          printf 'betaclean-smoke-sample' > "$work/sample.bin"
          echo "$(md5 -q "$work/sample.bin"):22:Betaclean.Smoke.Sample" > "$work/db/smoke.hdb"
          set +e
          "$clam/clamscan" --no-summary --database="$work/db" --cvdcertsdir="$clam/certs" "$work/sample.bin"
          code=$?
          set -e
          test "$code" -eq 1

      - name: Smoke test bundled ClamAV (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & src-tauri/resources/clamav/clamscan.exe --version
          & src-tauri/resources/clamav/freshclam.exe --version
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          $out = Join-Path $env:RUNNER_TEMP "msi"
          Start-Process msiexec -ArgumentList "/a `"$($msi.FullName)`" /qn TARGETDIR=`"$out`"" -Wait
          $scan = Get-ChildItem $out -Recurse -Filter clamscan.exe | Select-Object -First 1
          if (-not $scan) { throw "clamscan.exe không có trong bản cài" }
          & $scan.FullName --version

      - uses: actions/upload-artifact@v4
        with:
          name: betaclean-${{ runner.os }}
          path: |
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/msi/*.msi
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/msi/*.msi
