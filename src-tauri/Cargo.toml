[package]
name = "betaclean"
version = "0.1.0"
description = "betaClean"
authors = ["nottramdw"]
license = "MIT"
edition = "2024"

[lib]
name = "betaclean_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
czkawka_core = "12.0.2"
crossbeam-channel = "0.5"
trash = "5"
sysinfo = { version = "0.40", default-features = false, features = ["system", "user"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
